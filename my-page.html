<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web mới của Subaury</title>
    <!-- Thư viện FontAwesome để hiển thị icon Điện thoại và Email -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            /* Đặt hình nền từ file ảnh cùng thư mục */
            background: url('3192993e72fd3146b6edbe33fe140aab.jpg') no-repeat center center/cover;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        /* Lớp phủ tối nhẹ để làm nổi bật khung chữ */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            max-width: 500px;
            width: 100%;
        }

        /* Hiệu ứng đổ bóng & phát sáng cho H1 */
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #e6faf6;
            text-shadow: 
                0 2px 4px rgba(0, 0, 0, 0.6),
                0 4px 12px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
        }

        p {
            font-size: 16px;
            color: #f0f0f0;
            line-height: 1.6;
            margin-bottom: 25px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* Khung chứa các nút điều hướng */
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-weight: bold;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            background: #ffffff;
            color: #333;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        /* Mục liên hệ phía dưới */
        .bottom-contact {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .bottom-contact a {
            color: #e6faf6;
            text-decoration: none;
            transition: all 0.3s ease;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        .bottom-contact a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Nút Back */
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Subaury</h1>
        <p>Fanpage chuyên bán commission, web cá nhân!</p>

        <!-- Danh sách 3 nút điều hướng -->
        <div class="nav-buttons">
            <a href="Price" class="btn">Price (Bảng Giá)</a>
            <a href="samples.html" class="btn">Samples (Mẫu Thiết Kế)</a>
            <a href="commission.html" class="btn">Commission</a>
        </div>

        <!-- MỤC LIÊN HỆ -->
        <div class="bottom-contact">
            <a href="tel:0765810673">
                <i class="fa-solid fa-phone"></i> 0765 810 673
            </a>
            <a href="mailto:1450080165@sv.hcmunre.edu.vn">
                <i class="fa-solid fa-envelope"></i> 1450080165@sv.hcmunre.edu.vn
            </a>
        </div>
           
        <!-- Nút quay lại trang chủ -->
        <a href="index.html" class="back-btn">← Back</a>
    </div>

</body>
</html>
