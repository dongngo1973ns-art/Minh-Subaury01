<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <!-- TÍCH HỢP THƯ VIỆN LOGO FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* --- 1. CHUẨN HÓA TOÀN TRANG (RESET CSS) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            display: flex;
            justify-content: center; /* Căn giữa card theo chiều ngang */
            align-items: center;     /* Căn giữa card theo chiều dọc */
        }

        /* --- 2. VIDEO NỀN --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.65); /* Làm tối nền nhẹ để nổi bật khung nội dung */
        }

        /* --- 3. CẤU HÌNH KHUNG PROFILE CARD --- */
        .profile-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #ffffff;
            padding: 32px 24px;
            border-radius: 24px;
            text-align: center;
            width: 320px;
            max-width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.25);
            overflow: hidden;
        }

        /* --- 4. CĂN GIỮA AVATAR HÌNH TRÒN CHUẨN --- */
        .profile-card img.avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.9);
            object-fit: cover;
            display: block;
            margin: 0 auto 16px auto; /* Căn giữa tuyệt đối */
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .profile-card img.avatar:hover {
            transform: scale(1.05); /* Hiệu ứng phóng to nhẹ khi di chuột */
        }

        .profile-card h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .profile-card p.location {
            font-size: 13px;
            color: #e0e0e0;
            font-style: italic;
            margin-bottom: 20px;
        }

        /* --- 5. TRẠNG THÁI DISCORD --- */
        .discord-status {
            background: rgba(0, 0, 0, 0.45);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13.5px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .discord-status span {
            font-weight: bold;
            color: #5865F2; /* Màu chuẩn Discord */
        }

        .discord-status p {
            margin-top: 4px;
            color: #dddddd;
        }

        /* --- 6. CÁC NÚT MẠNG XÃ HỘI (CÓ LOGO) --- */
        .social-links a {
            display: flex;               /* Dùng Flexbox căn logo và chữ nằm ngang */
            align-items: center;
            justify-content: center;
            gap: 10px;                   /* Khoảng cách giữa logo và chữ */
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s ease;
        }

        .social-links a:last-child {
            margin-bottom: 0;
        }

        /* Kích thước logo */
        .social-links a i {
            font-size: 18px;
        }

        .social-links a:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>

    <!-- VIDEO NỀN (Lưu file video tên "video.mp4" chung thư mục với file này) -->

    </div>

</body>
