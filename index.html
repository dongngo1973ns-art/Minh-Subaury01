<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@Subaury</title>
    
    <!-- TÍCH HỢP THƯ VIỆN LOGO FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* --- 1. RESET CHUẨN KÍCH THƯỚC TOÀN TRANG --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            display: flex;
            justify-content: center; /* Căn giữa card theo chiều ngang */
            align-items: center;     /* Căn giữa card theo chiều dọc */
        }

        /* --- 2. VIDEO NỀN --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.7); /* Giảm độ sáng video nhẹ để nổi chữ */
        }

        /* --- 3. KHUNG PROFILE CARD TRONG SUỐT (GLASSMORPHISM) --- */
        .profile-card {
            position: relative;
            z-index: 1;
            
            /* Nền trong suốt màu trắng đục nhẹ (Không bị đen xì) */
            background: rgba(255, 255, 255, 0.15) !important;
            
            /* Hiệu ứng mờ kính chuẩn mọi trình duyệt */
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            backdrop-filter: blur(16px) saturate(180%);
            
            color: #ffffff;
            padding: 32px 24px;
            border-radius: 24px;
            text-align: center;
            width: 320px;
            max-width: 90%;
            
            /* Viền mỏng sáng & Đổ bóng kính */
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            overflow: hidden;
        }

        /* --- 4. AVATAR HÌNH TRÒN CĂN GIỮA TUYỆT ĐỐI --- */
        .profile-card img.avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            object-fit: cover;
            display: block;
            margin: 0 auto 16px auto; /* Căn giữa chính xác */
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .profile-card img.avatar:hover {
            transform: scale(1.05); /* Hiệu ứng phóng nhẹ khi di chuột */
        }

        .profile-card h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .profile-card p.location {
            font-size: 13px;
            color: #f0f0f0;
            font-style: italic;
            margin-bottom: 20px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        /* --- 5. TRẠNG THÁI DISCORD TRONG SUỐT --- */
        .discord-status {
            /* Giảm độ tối xuống mờ nhẹ thay vì đen sì */
            background: rgba(0, 0, 0, 0.25);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13.5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
        }

        .discord-status span {
            font-weight: bold;
            color: #7289da; /* Màu xanh đặc trưng của Discord */
        }

        .discord-status p {
            margin-top: 4px;
            color: #ffffff;
        }

        /* --- 6. CÁC NÚT MẠNG XÃ HỘI (TRONG SUỐT CÓ LOGO) --- */
        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            
            /* Nút trong suốt mờ ảo */
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }

        .social-links a:last-child {
            margin-bottom: 0;
        }

        .social-links a i {
            font-size: 18px;
        }

        /* Hiệu ứng di chuột sáng lên */
        .social-links a:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>

    <!-- VIDEO NỀN (Khớp chuẩn tên file Download (1).mp4 trên GitHub của bạn) -->
    <video autoplay muted loop id="bg-video">
        <source src="Download (1).mp4" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ video HTML5.
    </video>

    <!-- CARD THÔNG TIN CÁ NHÂN -->
    <div class="profile-card">
        <!-- Ảnh đại diện -->
        <img src="https://i.pinimg.com/736x/d4/75/3a/d4753afb229798ae94d393f78be683b3.jpg" alt="Avatar Subaury" class="avatar">

        <!-- Thông tin cá nhân -->
        <h2>Subaury</h2>
        <p class="location">Ho Chi Minh city, Vietnam</p>

        <!-- Trạng thái Discord -->
        <div class="discord-status">
            <span><i class="fa-brands fa-discord"></i> Subaury</span>
            <p>Playing <strong>ROBLOX</strong></p>
        </div>

        <!-- Các nút liên kết mạng xã hội -->
        <div class="social-links">
            <a href="https://discord.com/channels/1367571226234589314/1523426366601560206" target="_blank">
                <i class="fa-brands fa-discord"></i> Discord
            </a>
            <a href="https://www.facebook.com/profile.php?id=100069639904938" target="_blank">
                <i class="fa-brands fa-facebook"></i> Facebook
            </a>
            <a href="https://www.tiktok.com/@_subaruy_" target="_blank">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>
        </div>
    </div>

</body>
</html>
